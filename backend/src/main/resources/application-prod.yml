spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/autoforge}
    username: ${DB_USER:autoforge_user}
    password: ${DB_PASS:autoforge_pass}
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

aws:
  s3:
    endpoint: ${AWS_S3_ENDPOINT:http://localhost:9000}
    access-key: ${AWS_ACCESS_KEY}
    secret-key: ${AWS_SECRET_KEY}
    bucket-name: ${AWS_BUCKET:autoforge-docs}

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRY:86400000}

logging:
  level:
    root: WARN
    com.autoforge: INFO
