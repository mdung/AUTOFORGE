server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: autoforge-backend
  datasource:
    url: jdbc:postgresql://localhost:5433/autoforge
    username: autoforge_user
    password: autoforge_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000

# AWS S3 / MinIO Configuration
aws:
  s3:
    endpoint: http://localhost:9000
    access-key: minioadmin
    secret-key: minioadmin
    region: us-east-1
    bucket-name: autoforge-docs

